name: Campaign CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predixlab-campaign-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Check locked production requirements
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          if ! diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"; then
            echo "::error::requirements.txt is out of sync with uv.lock. Run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt"
            exit 1
          fi

      - name: Install locked dependencies
        run: uv sync --frozen --extra test

      - name: Run tests
        run: uv run --frozen python -m pytest

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: predixlab-campaign
          package: .
          respect-funcignore: true
